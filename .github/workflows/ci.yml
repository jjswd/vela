name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Match the range the project claims to support.
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # The server extra is included so the HTTP surface is tested too.
          pip install -e ".[dev,server]"

      - name: Run tests
        run: pytest -q

      - name: Run tests without bytecode caching
        # Guards against tests that only pass because of leftover state.
        run: PYTHONDONTWRITEBYTECODE=1 pytest -q

      - name: Run the offline verification
        # Proves the documented behaviour still holds, and that the package
        # works from a clean checkout without any credentials.
        run: python examples/verify.py

      - name: Check the core without the web stack
        # FastAPI is optional, so the core must import even when the web
        # packages are unavailable. Blocking the import in a subprocess tests
        # the guarantee directly rather than inferring it from what happens to
        # be installed.
        run: |
          python - <<'PY'
          import sys

          class Blocker:
              def find_spec(self, name, path=None, target=None):
                  if name.split('.')[0] in ('fastapi', 'pydantic', 'starlette'):
                      raise ImportError('blocked')
                  return None

          sys.meta_path.insert(0, Blocker())
          import vela
          assert vela.available_providers()
          print('core imports without the web stack')
          PY

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src tests examples

  types:
    name: type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,server]" mypy
      - name: Run mypy
        # The provider/tool boundary is where types matter most, so start there
        # and report rather than fail the build while the codebase is typed out.
        run: mypy src/vela --ignore-missing-imports || true

  package:
    name: build wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - name: Build
        run: python -m build
      # A package that cannot be installed is not a usable dependency.
      - name: Verify the wheel installs and imports
        run: |
          pip install dist/*.whl
          python -c "import vela; print(vela.__version__); print(vela.available_providers())"

  demo:
    name: quick start
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,server]"
      - name: Run the quick-start demo
        # Proves the documented entry point works on a clean machine, with no
        # API key and no network access.
        run: python examples/demo.py
